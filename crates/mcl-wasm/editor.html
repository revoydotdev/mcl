<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCL Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e0e; color: #c0c0c0; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; }
  header { background: #151515; padding: 8px 16px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 16px; }
  header h1 { color: #4a8; font-size: 16px; font-weight: normal; }
  header .status { font-size: 12px; color: #666; }
  header .status.ok { color: #4a4; }
  header .status.err { color: #a44; }
  .panels { flex: 1; display: flex; overflow: hidden; }
  .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a; }
  .preview-panel { flex: 1; display: flex; flex-direction: column; }
  .panel-header { background: #151515; padding: 6px 12px; font-size: 12px; color: #888; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; }
  .panel-header button { background: #222; border: 1px solid #444; color: #4a8; padding: 2px 10px; cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 3px; }
  .panel-header button:hover { background: #333; }
  .panel-header button.active { background: #2a4a2a; border-color: #4a8; }
  textarea { flex: 1; background: #0a0a0a; color: #d0d0d0; border: none; padding: 12px; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; tab-size: 2; }
  .preview { flex: 1; overflow-y: auto; padding: 12px; font-size: 13px; line-height: 1.6; }
  .preview h3 { color: #4a8; margin: 12px 0 4px; font-size: 13px; }
  .preview h3:first-child { margin-top: 0; }
  .preview .item { padding: 2px 0; }
  .preview .key { color: #8ab; }
  .preview .val { color: #ba8; }
  .preview .tag { display: inline-block; background: #1a2a1a; color: #6b6; padding: 0 6px; border-radius: 3px; margin: 1px 2px; font-size: 11px; }
  .preview .error { color: #c44; padding: 8px; background: #1a0a0a; border: 1px solid #422; border-radius: 4px; margin: 8px 0; }
  .preview .prompt { white-space: pre-wrap; background: #0a0a0a; padding: 8px; border: 1px solid #222; border-radius: 4px; font-size: 12px; color: #999; max-height: 400px; overflow-y: auto; }
  .tabs { display: flex; gap: 0; }
  .tabs button { background: #111; border: none; border-bottom: 2px solid transparent; color: #666; padding: 6px 14px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .tabs button.active { color: #4a8; border-bottom-color: #4a8; background: #0a0a0a; }
</style>
</head>
<body>
<header>
  <h1>MCL Editor</h1>
  <span id="status" class="status">Loading WASM...</span>
</header>
<div class="panels">
  <div class="editor-panel">
    <div class="panel-header">
      <span>Source (.mcl)</span>
      <div>
        <button onclick="loadExample('crypt')">Crypt</button>
        <button onclick="loadExample('debate')">Debate</button>
        <button onclick="loadExample('quiz')">Quiz</button>
      </div>
    </div>
    <textarea id="source" spellcheck="false"></textarea>
  </div>
  <div class="preview-panel">
    <div class="panel-header">
      <div class="tabs">
        <button class="active" onclick="setTab('inspect')" id="tab-inspect">Inspect</button>
        <button onclick="setTab('prompt')" id="tab-prompt">System Prompt</button>
        <button onclick="setTab('json')" id="tab-json">AST (JSON)</button>
      </div>
    </div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<script type="module">
import init, { parse, build_prompt, validate } from './pkg/mcl_wasm.js';

let currentTab = 'inspect';
let wasmReady = false;

const EXAMPLES = {
  crypt: `---
context: demo_room
type: room
domain: rpg
---

# State
lit: false
door_north: locked

# Entities
- skeleton_guard:
    type: enemy
    disposition: hostile
    hp: 12
    ac: 12

# Items
- rusty_key: { on: floor, visible_when: lit }
- flint: { on: ground, near: entrance }

# Actions
- look:
    description: "Survey the room"
    trigger: [look, observe, survey]
- attack:
    target: enum(entities.enemies)
    resolution: combat_system
    description: "Strike an enemy"
    trigger: [attack, hit, strike, fight]
- pickup:
    target: enum(items)
    resolution: inventory_system
    description: "Pick up an item"
    trigger: [pick up, grab, take]
- light_torch:
    requires: [inventory.flint]
    mutates: { lit: true }
    description: "Light the torch"
    trigger: [light, light torch, use flint]

# Transitions
- inner_room:
    when: door_north == unlocked
    direction: north

# Narrator
tone: dread
voice: second_person
tense: present
context: "A dark crypt. A skeleton guards a door."
forbidden: [epic, awesome]

# Knowledge
- guards_tomb
- !secret_passage

# Constraints
- The skeleton does not attack first`,

  debate: `---
context: opening_round
type: scene
domain: debate
---

# State
round: 1
topic: "Should AI have knowledge boundaries?"

# Entities
- moderator:
    type: npc
    disposition: neutral

# Actions
- argue:
    description: "Present an argument"
    trigger: [argue, present, claim]
- rebut:
    description: "Counter the opponent"
    trigger: [rebut, counter, disagree]
- concede:
    description: "Concede a point"
    trigger: [concede, agree, accept]

# Narrator
tone: analytical
voice: third_person
tense: present
context: "A structured debate is underway."
forbidden: [obviously, clearly]

# Knowledge
- debate_topic
- !judge_scoring`,

  quiz: `---
context: question_1
type: step
domain: quiz
---

# State
score: 0
answered: false

# Entities
- quizmaster:
    type: npc
    disposition: friendly

# Actions
- answer_a:
    description: "Answer: let"
    trigger: [a, let]
    mutates: { score: 1, answered: true }
- answer_b:
    description: "Answer: var"
    trigger: [b, var]
    mutates: { answered: true }
- ask_hint:
    description: "Ask for a hint"
    trigger: [hint, help]

# Transitions
- question_2:
    when: answered == true
    direction: next

# Narrator
tone: encouraging
voice: second_person
tense: present
context: "What keyword declares an immutable variable in Rust?"
forbidden: [wrong, stupid]

# Knowledge
- question_text
- !correct_answer`
};

await init();
wasmReady = true;
document.getElementById('status').textContent = 'Ready';
document.getElementById('status').className = 'status ok';
document.getElementById('source').value = EXAMPLES.crypt;
update();

document.getElementById('source').addEventListener('input', update);

function update() {
  if (!wasmReady) return;
  const src = document.getElementById('source').value;
  if (currentTab === 'inspect') renderInspect(src);
  else if (currentTab === 'prompt') renderPrompt(src);
  else if (currentTab === 'json') renderJson(src);
}

function renderInspect(src) {
  try {
    const raw = validate(src);
    const info = JSON.parse(raw);
    if (!info.valid) {
      document.getElementById('preview').innerHTML = `<div class="error">${info.error}</div>`;
      document.getElementById('status').textContent = 'Parse error';
      document.getElementById('status').className = 'status err';
      return;
    }
    document.getElementById('status').textContent = `Valid — ${info.context} (${info.type})`;
    document.getElementById('status').className = 'status ok';

    let html = `<h3>Context</h3><div class="item"><span class="key">name:</span> <span class="val">${info.context}</span></div>`;
    html += `<div class="item"><span class="key">type:</span> <span class="val">${info.type}</span></div>`;

    if (info.actions.length) {
      html += `<h3>Actions (${info.actions.length})</h3>`;
      info.actions.forEach(a => { html += `<div class="item"><span class="tag">${a}</span></div>`; });
    }
    if (info.entities.length) {
      html += `<h3>Entities (${info.entities.length})</h3>`;
      info.entities.forEach(e => { html += `<div class="item"><span class="tag">${e}</span></div>`; });
    }
    if (info.items.length) {
      html += `<h3>Items (${info.items.length})</h3>`;
      info.items.forEach(i => { html += `<div class="item"><span class="tag">${i}</span></div>`; });
    }
    if (info.transitions.length) {
      html += `<h3>Transitions (${info.transitions.length})</h3>`;
      info.transitions.forEach(t => { html += `<div class="item"><span class="tag">${t}</span></div>`; });
    }
    document.getElementById('preview').innerHTML = html;
  } catch (e) {
    document.getElementById('preview').innerHTML = `<div class="error">${e}</div>`;
  }
}

function renderPrompt(src) {
  try {
    const prompt = build_prompt(src);
    document.getElementById('preview').innerHTML = `<div class="prompt">${escapeHtml(prompt)}</div>`;
  } catch (e) {
    document.getElementById('preview').innerHTML = `<div class="error">${e}</div>`;
  }
}

function renderJson(src) {
  try {
    const json = parse(src);
    document.getElementById('preview').innerHTML = `<div class="prompt">${escapeHtml(json)}</div>`;
  } catch (e) {
    document.getElementById('preview').innerHTML = `<div class="error">${e}</div>`;
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.setTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  update();
};

window.loadExample = function(name) {
  document.getElementById('source').value = EXAMPLES[name] || '';
  update();
};
</script>
</body>
</html>
