[package]
name = "mcl-registry"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Append-only signal registry with content-addressed entries and fsync policy"
license.workspace = true
repository.workspace = true
keywords = ["mcl", "registry", "signal-log", "audit"]
categories = ["game-development"]

[dependencies]
mcl-spec = { path = "../mcl-spec", version = "0.1.0" }
mcl-graph = { path = "../mcl-graph", version = "0.1.0" }
mcl-memory = { path = "../mcl-memory", version = "0.1.0" }
mcl-llm = { path = "../mcl-llm", version = "0.1.0" }
mcl-policy = { path = "../mcl-policy", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1"
thiserror = { workspace = true }
log = { workspace = true }
fd-lock = "4"
async-trait = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "ingest_throughput"
harness = false

[[bench]]
name = "query_latency"
harness = false

[lints]
workspace = true
