[workspace]
resolver = "2"
members = [
    "crates/mcl-spec",
    "crates/mcl-parse",
    "crates/mcl-signal",
    "crates/mcl-runtime",
    "crates/mcl-llm",
    "crates/mcl-domains",
    "crates/mcl-memory",
    "crates/mcl-graph",
    "crates/mcl-lang",
    "crates/mcl-nodes",
    "crates/mcl-mcp",
    "crates/mcl-cli",
    "crates/mcl-server",
    "crates/mcl-wasm",
    "crates/mcl-registry",
    "crates/mcl-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["revelri"]
license = "MIT"
repository = "https://github.com/revoydotdev/mcl"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-util = "0.3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.clippy]
too_many_arguments = "allow"
unwrap_used = "deny"
manual_range_contains = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
explicit_iter_loop = "warn"
single_match_else = "warn"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"
opt-level = 2
